services:
  - type: web
    name: casahonor-inmobiliaria
    runtime: static
    # Solo se publica lo que ve el visitante: notas internas, herramientas y render.yaml quedan fuera.
    buildCommand: mkdir -p dist && cp -r index.html 404.html robots.txt sitemap.xml css js img media legal dist/
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # Direcciones del WordPress anterior (oct 2026) → sección equivalente de la web nueva.
    # Lo que no esté aquí y no exista recibe 404.html (ya no se manda todo a la portada).
    routes:
      # Archivos internos que quedaron de despliegues anteriores: no se muestran
      - type: redirect
        source: /DATOS-A-VERIFICAR.md
        destination: /
      - type: redirect
        source: /FOTOS-REQUERIDAS.md
        destination: /
      - type: redirect
        source: /README.md
        destination: /
      - type: redirect
        source: /render.yaml
        destination: /
      - type: redirect
        source: /herramientas/*
        destination: /
      - type: redirect
        source: /propiedades/*
        destination: /#propiedades
      - type: redirect
        source: /propiedades
        destination: /#propiedades
      - type: redirect
        source: /property/*
        destination: /#propiedades
      - type: redirect
        source: /property
        destination: /#propiedades
      - type: redirect
        source: /agentes/*
        destination: /#nosotros
      - type: redirect
        source: /agentes
        destination: /#nosotros
      - type: redirect
        source: /nosotros/*
        destination: /#nosotros
      - type: redirect
        source: /nosotros
        destination: /#nosotros
      - type: redirect
        source: /contacto/*
        destination: /#contacto
      - type: redirect
        source: /contacto
        destination: /#contacto
      - type: redirect
        source: /blog/*
        destination: /
      - type: redirect
        source: /blog
        destination: /
      - type: redirect
        source: /2021/*
        destination: /
      - type: redirect
        source: /category/*
        destination: /
